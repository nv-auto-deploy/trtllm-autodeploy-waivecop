name: TRT-LLM AutoDeploy new-waiver alerts

on:
  schedule:
    # Hourly. GitHub cron is UTC + best-effort; ":23" dodges top-of-hour congestion.
    # The job polls waives.txt and alerts only when a NEW AutoDeploy waiver appears.
    - cron: "23 * * * *"
  workflow_dispatch: {}   # manual run (checks immediately)

# Needed so the job can commit the last-seen snapshot back to this repo.
permissions:
  contents: write

# Serialize runs so two polls can't race on the snapshot commit.
concurrency:
  group: autodeploy-waiver-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check for new AutoDeploy waivers and alert Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.AUTODEPLOY_WAIVECOP }}
          SLACK_CHANNEL_ID: ${{ vars.AUTODEPLOY_DEV_CHANNEL }}
          STATE_FILE: .state/autodeploy_waivers.json
        run: python3 .github/scripts/watch_autodeploy_waivers.py

      - name: Persist snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/autodeploy_waivers.json
          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
          else
            git commit -m "Update AutoDeploy waiver snapshot [skip ci]"
            git push
          fi
