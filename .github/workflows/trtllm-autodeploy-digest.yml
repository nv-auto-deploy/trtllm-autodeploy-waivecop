name: TRT-LLM AutoDeploy daily digest

on:
  schedule:
    # GitHub cron is UTC + best-effort. 07:00 America/Los_Angeles is 14:00 UTC in PDT
    # and 15:00 UTC in PST. Register both; the gate runs whichever matches the current
    # DST period (offset + which cron fired) — so a delayed run posts late, never skips.
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}   # manual run (always posts)

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this run should post (7am Pacific, DST-aware)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET="$(TZ=America/Los_Angeles date +%z)"   # -0700 (PDT) or -0800 (PST)
          SCHED="${{ github.event.schedule }}"
          echo "Pacific UTC offset: $OFFSET ; triggering cron: '$SCHED'"
          if [ "$OFFSET" = "-0700" ] && [ "$SCHED" = "0 14 * * 1-5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$OFFSET" = "-0800" ] && [ "$SCHED" = "0 15 * * 1-5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the 7am-Pacific trigger for the current DST period — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Post full AutoDeploy waiver digest
        if: steps.gate.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.AUTODEPLOY_WAIVECOP }}
          SLACK_CHANNEL_ID: ${{ vars.AUTODEPLOY_DEV_CHANNEL }}
        run: python3 .github/scripts/post_autodeploy_waivers.py
